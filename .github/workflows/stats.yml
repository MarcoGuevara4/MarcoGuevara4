name: Generate GitHub Stats

on:
  schedule:
    - cron: "0 */12 * * *"

  workflow_dispatch:

  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write

    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate GitHub stats
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: stats
          options: username=${{ github.repository_owner }}&locale=en&show_icons=true&theme=dracula&hide_border=false&include_all_commits=true&hide_rank=true&hide=issues,reviews
          path: profile/github-stats.svg
          token: ${{ secrets.GH_STATS_TOKEN }}

      - name: Commit GitHub stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/github-stats.svg

          git diff --cached --quiet || git commit -m "Update GitHub stats"

          git push
